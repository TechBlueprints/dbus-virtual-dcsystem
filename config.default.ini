[DEFAULT]

; Logging level: ERROR, WARNING, INFO, DEBUG
LOGGING = INFO

; How often to recalculate DC system power (seconds)
UPDATE_INTERVAL = 1

; How often to emit a summary log line (seconds)
LOG_INTERVAL = 300

; SMARTSHUNT_KEYWORD (removed) — this used to identify SmartShunts by
; ProductName for a shunt-vs-BMS classification step.  That heuristic
; was removed; the service now decides whether a battery service can
; contribute to power math based on whether it publishes
; /Dc/0/Current.  Anything publishing both V and I counts; anything
; without current is skipped.  The setting is ignored if present.
